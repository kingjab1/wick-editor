# Rebuilds the Learn tab catalog from learn/examples and publishes the site.
# Runs on every push to main, so uploading an example through GitHub is all it takes.
# Build and deploy are separate jobs (GitHub's recommended setup) so the deploy
# always finds the uploaded site.
name: Build Learn catalog and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Learn catalog
        run: node learn/build-catalog.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
